<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card" id="letterCard">
            <h1>I'm Sorry 🥺</h1>
            <p>I value our relationship more than anything. I am truly sorry for what happened and want to make things right.</p>
            <p>Can we talk?</p>
            <div class="buttons">
                <button class="btn yes-btn" onclick="acceptApology()">Yes, let's talk</button>
                <button class="btn no-btn" id="noBtn">No</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
