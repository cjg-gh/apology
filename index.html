<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Flashcard Wrapper -->
        <div class="flashcard-container">
            <button class="nav-btn" id="prevBtn" onclick="prevCard()">&lt;</button>
            
            <div class="card" id="flashcard">
                <p id="cardText">Loading message...</p>
                <span id="cardNumber" class="card-number">1/5</span>
            </div>
            
            <button class="nav-btn" id="nextBtn" onclick="nextCard()">&gt;</button>
        </div>

        <!-- Final Response Buttons (Hidden until the last card) -->
        <div class="action-container id-hidden" id="actionArea">
            <h3>Can we talk?</h3>
            <div class="buttons">
                <button class="btn yes-btn" onclick="acceptApology()">Yes, let's talk</button>
                <button class="btn no-btn" id="noBtn">No</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
